name: pull request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    # Skip CI entirely when the PR does not touch Go build/code related files,
    # to save CI time (e.g. docs-only or asset-only changes).
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work*'
      - 'Makefile'
      - 'hack/**'
      - '.golangci*'
      - '.github/workflows/pr.yaml'
jobs:
  pr-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commitsar check
        uses: aevea/commitsar@v0.20.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Build to test
        run: |
          make autok3s build only
          bin/$(go env GOOS)/$(go env GOARCH)/autok3s version
